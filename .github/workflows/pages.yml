name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    name: Build WebGL demos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      - name: Create site directory
        run: mkdir -p site

      # Inject -s MIN_WEBGL_VERSION=2 at runtime so the GLSL ES 3.00 shader parser
      # is used, without modifying any source files.
      # - name: Build Chapter2/2-OpenGLES3_Primitives-Modern
      #   continue-on-error: true
      #   working-directory: Chapter2/2-OpenGLES3_Primitives-Modern
      #   run: |
      #     sed 's/-s USE_WEBGL2=1 \\/-s USE_WEBGL2=1 \\\n    -s MIN_WEBGL_VERSION=2 \\/' build_web.sh | bash
      #     mkdir -p ../../site/Chapter2/2-OpenGLES3_Primitives-Modern
      #     cp -r web/. ../../site/Chapter2/2-OpenGLES3_Primitives-Modern/


      # - name: Build WebGL
      #   run: |
      #     sed 's/-s USE_WEBGL2=1 \\/-s USE_WEBGL2=1 \\\n    -s MIN_WEBGL_VERSION=2 \\/' build_web.sh | bash


      - name: Build Quiz2
        working-directory: Quiz2
        run: |
          bash build_web.sh
          mkdir -p ../site/Quiz2
          cp -r web/. ../site/Quiz2/

      - name: Generate index.html
        run: |
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>OpenGL ES 3.0 Modern — WebGL Demo</title>
          </head>
          <body>
            <h1>OpenGL ES 3.0 Modern</h1>
            <p>An interactive WebGL demo that runs directly in your browser. No installation needed.</p>

            <h2>Quiz 2 - Spinning Fan</h2>
            <p>Fan that spins when you swipe on it</p>
            <p><a href="Quiz2/">Launch the assignment</a></p>

            <p style="color: white;">According to all known laws of aviation, there is no way a bee should be able to fly.</p>
            <p style="color: white;">Its wings are too small to get its fat little body off the ground.</p>
            <p style="color: white;">The bee, of course, flies anyway because bees don't care what humans think is impossible.</p>
            <p style="color: white;">Yellow, black. Yellow, black. Yellow, black. Yellow, black.</p>
            <p style="color: white;">Ooh, black and yellow!</p>
            <p style="color: white;">Let's shake it up a little.</p>
            <p style="color: white;">Barry! Breakfast is ready!</p>
            <p style="color: white;">Coming!</p>
            <p style="color: white;">Hang on a second.</p>
            <p style="color: white;">Hello?</p>
            <p style="color: white;">Barry?</p>
            <p style="color: white;">Adam?</p>
            <p style="color: white;">Can you believe this is happening?</p>
            <p style="color: white;">I can't.</p>
            <p style="color: white;">I'll pick you up.</p>
            <p style="color: white;">Looking sharp.</p>
            <p style="color: white;">Use the stairs, Your father paid good money for those.</p>
            <p style="color: white;">Sorry. I'm excited.</p>
            <p style="color: white;">Here's the graduate.</p>
            <p style="color: white;">We're very proud of you, son.</p>
            <p style="color: white;">A perfect report card, all B's.</p>
            <p style="color: white;">Very proud.</p>
            <p style="color: white;">Ma! I got a thing going here.</p>
            <p style="color: white;">You got lint on your fuzz.</p>
            <p style="color: white;">Ow! That's me!</p>
            <p style="color: white;">Wave to us! We'll be in row 118,000.</p>
            <p style="color: white;">Bye!</p>
            <p style="color: white;">Barry, I told you, stop flying in the house!</p>
            <p style="color: white;">Hey, Adam.</p>
            <p style="color: white;">Hey, Barry.</p>
            <p style="color: white;">Is that fuzz gel?</p>
            <p style="color: white;">A little. Special day, graduation.</p>
            <p style="color: white;">Never thought I'd make it.</p>
            <p style="color: white;">Three days grade school, three days high school.</p>
            <p style="color: white;">Those were awkward.</p>
            <p style="color: white;">Three days college. I'm glad I took a day and hitchhiked around The Hive.</p>
            <p style="color: white;">You did come back different.</p>
            <p style="color: white;">Hi, Barry. Artie, growing a mustache? Looks good.</p>
            <p style="color: white;">Hear about Frankie?</p>
            <p style="color: white;">Yeah.</p>
            <p style="color: white;">You going to the funeral?</p>
            <p style="color: white;">No, I'm not going.</p>
            <p style="color: white;">Everybody knows, sting someone, you die.</p>
            <p style="color: white;">Don't waste it on a squirrel.</p>
            <p style="color: white;">Such a hothead.</p>
            <p style="color: white;">I guess he could have just gotten out of the way.</p>
            <p style="color: white;">I love this incorporating an amusement park into our day.</p>
            <p style="color: white;">That's why we don't need vacations.</p>
            <p style="color: white;">Boy, quite a bit of pomp under the circumstances.</p>
            <p style="color: white;">Well, Adam, today we are men.</p>
            <p style="color: white;">We are!</p>
            <p style="color: white;">Bee-men.</p>
            <p style="color: white;">Amen!</p>
            <p style="color: white;">Hallelujah!</p>
            <p style="color: white;">Students, faculty, distinguished bees,</p>
            <p style="color: white;">please welcome Dean Buzzwell.</p>
            <p style="color: white;">Welcome, New Hive City graduating class of 9:15.</p>
            <p style="color: white;">That concludes our ceremonies And begins your career at Honex Industries!</p>
            <p style="color: white;">Will we pick our job today?</p>
            <p style="color: white;">I heard it's just orientation.</p>
            <p style="color: white;">Heads up! Here we go.</p>
            <p style="color: white;">Keep your hands and antennas inside the tram at all times.</p>
            <p style="color: white;">Wonder what it'll be like?</p>
            <p style="color: white;"> <a href="https://deltarune.com/d_a_m_n_y_o_u_t_e_n_n_a/" style="color: white; text-decoration: none;">I'M LOSING IT</a></p>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
